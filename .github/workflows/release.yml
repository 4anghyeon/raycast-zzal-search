name: Release Raycast extension

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install

      - run: npm run build:dist
        working-directory: raycast

      - run: zip -r ../../zzal-search.zip .
        working-directory: raycast/dist

      - uses: softprops/action-gh-release@v2
        with:
          files: zzal-search.zip
